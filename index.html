<style>
/* ===== Wind Hair House — Montserrat, đen trắng, tinh giản ===== */
:root{--bg:#000;--s1:#0A0A0A;--s2:#111;--s3:#1A1A1A;--line:#1F1F1F;--line2:#2E2E2E;--text:#F3F3F0;--muted:#9C9C98;--dim:#6E6E6A;
--sage:#B5CDB6;--sageBg:#0F1A12;--sand:#E3D3AE;--sandBg:#1C170D;--lilac:#CFCBE2;--lilacBg:#15141C;--rose:#EEB8A9;--roseBg:#221310;
--serif:'Montserrat','Helvetica Neue',Arial,sans-serif;--sans:'Montserrat','Helvetica Neue',Arial,sans-serif;--r:3px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-weight:400;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"lnum" 1}
button,input,select,textarea{font-family:inherit;font-size:13px}button{cursor:pointer}
:focus-visible{outline:1px solid var(--text);outline-offset:3px}
::selection{background:var(--text);color:#000}
h1{font-weight:200;font-size:42px;line-height:1.08;letter-spacing:-.01em;margin:0}
h2{font-weight:300;font-size:20px;letter-spacing:.01em;margin:0}
h3{font-weight:400;font-size:16px;margin:0}
.muted{color:var(--muted)}.small{font-size:12px;letter-spacing:.01em}
a{color:inherit}
/* nút */
.btn{min-height:44px;padding:0 22px;border-radius:var(--r);border:1px solid var(--line2);background:transparent;color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap;font-weight:500;letter-spacing:.06em;transition:background .15s,border-color .15s,color .15s}
.btn:hover{border-color:var(--text)}
.btn.pri{background:var(--text);color:#000;border-color:var(--text)}.btn.pri:hover{background:#fff}
.btn.sm{min-height:34px;padding:0 14px;font-size:12px;letter-spacing:.04em}
.btn.danger{color:var(--rose);border-color:#3D2520}.btn.danger:hover{border-color:var(--rose)}
.btn:disabled{opacity:.4;cursor:not-allowed}
/* ô nhập: kiểu gạch chân */
.in,select.in,textarea.in{min-height:44px;border:0;border-bottom:1px solid var(--line2);border-radius:0;background:transparent;color:var(--text);padding:0 2px;width:100%;font-size:14px;transition:border-color .15s}
.in:focus{outline:none;border-bottom-color:var(--text)}
select.in{cursor:pointer}select.in option{background:#111;color:var(--text)}
textarea.in{padding:10px 2px;min-height:84px;resize:vertical;border:1px solid var(--line2);padding:10px 12px;border-radius:var(--r)}
input[type=date].in,input[type=time].in,input[type=month].in,input[type=datetime-local].in{color-scheme:dark}
label.f{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
label.f .in{text-transform:none;letter-spacing:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 24px}
/* nhãn trạng thái */
.pill{display:inline-flex;align-items:center;gap:7px;padding:0;background:none!important;font-size:12px;letter-spacing:.02em;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-da_chot,.p-next{color:var(--lilac)}.p-da_den,.p-doing{color:var(--sand)}
.p-hoan_thanh,.p-ok{color:var(--sage)}.p-cho_duyet,.p-bad{color:var(--rose)}
.p-huy,.p-khong_den,.p-off{color:var(--dim)}
/* đăng nhập */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.login .art{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:40px;padding:64px;border-right:1px solid var(--line)}
.login .art img{width:min(300px,60%);height:auto}
.login .art p{font-weight:200;font-size:17px;letter-spacing:.24em;text-transform:uppercase;text-align:center;margin:0;color:#D8D8D4;max-width:none}
.login .art p::before{content:"";display:block;width:40px;height:1px;background:var(--line2);margin:0 auto 28px}
.login .art>span{position:absolute;bottom:40px;left:0;right:0;text-align:center;font-size:12px;color:var(--dim)}
.login .form{display:flex;align-items:center;justify-content:center;padding:48px 28px}
.login .box{width:100%;max-width:360px;display:flex;flex-direction:column;gap:22px}
.login h1{font-size:34px}
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--line)}
.tabs button{min-height:40px;border:0;border-bottom:1px solid transparent;margin-bottom:-1px;background:transparent;color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:0}
.tabs button.on{color:var(--text);border-bottom-color:var(--text)}
.msg{font-size:13px;line-height:1.6;padding:14px 16px;border-left:1px solid var(--line2);background:var(--s1)}
.msg.err{border-left-color:var(--rose);color:var(--rose);background:var(--roseBg)}.msg.ok{border-left-color:var(--sage);color:var(--sage);background:var(--sageBg)}
/* khung app */
.shell{display:flex;min-height:100vh}
.side{width:236px;flex-shrink:0;border-right:1px solid var(--line);padding:40px 0 28px;display:flex;flex-direction:column;gap:40px;position:sticky;top:0;height:100vh;overflow-y:auto}
.word{padding:0 32px;font-weight:600;font-size:22px;letter-spacing:.42em;line-height:1}
.word small{display:block;font-weight:300;font-size:10px;letter-spacing:.52em;color:var(--muted);margin-top:10px;text-transform:uppercase}
.nav{display:flex;flex-direction:column}
.nav a{position:relative;display:flex;align-items:center;padding:0 32px;min-height:40px;color:var(--muted);text-decoration:none;font-size:13px;letter-spacing:.03em;transition:color .15s}
.nav a:hover{color:var(--text)}
.nav a.on{color:var(--text);font-weight:500}
.nav a.on::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:2px;background:var(--text)}
.who{margin-top:auto;padding:24px 32px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:14px;font-size:13px}
.who .btn{align-self:flex-start}
.main{flex:1;min-width:0;padding:48px 56px 80px;display:flex;flex-direction:column;gap:40px;max-width:1440px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;padding-bottom:28px;border-bottom:1px solid var(--line)}
.head>div>.small.muted:first-child{letter-spacing:.14em;text-transform:uppercase;font-size:11px}
.head>div>.small.muted:not(:first-child){max-width:70ch;line-height:1.6;color:var(--dim)}
/* khối nội dung */
.panel{background:transparent;border:0;border-top:1px solid var(--line);border-radius:0;padding:28px 0 0}
.panel>h2:first-child{font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.panel .head h2{font-size:26px;font-weight:200}
.panel .head{padding-bottom:0;border:0}
/* chỉ số */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpi{padding:28px 28px 30px;display:flex;flex-direction:column;gap:12px;border-left:1px solid var(--line);background:transparent;border-radius:0}
.kpi:first-child{border-left:0;padding-left:0}
.kpi span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.kpi span:last-child{text-transform:none;letter-spacing:.01em;font-size:12px;color:var(--dim)}
.kpi b{font-weight:200;font-size:36px;line-height:1;letter-spacing:-.02em;font-family:var(--sans)}
.kpi.alert b,.kpi.alert span:first-child{color:var(--rose)}
/* bảng */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:500;color:var(--dim);font-size:10px;letter-spacing:.16em;text-transform:uppercase;padding:0 14px 14px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{padding-left:0}
.tbl td{padding:18px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr{transition:background .12s}.tbl tbody tr:hover td{background:#070707}
.tbl .t{font-weight:300;font-size:20px;letter-spacing:-.01em;font-family:var(--sans)}
.tbl .small.muted,.tbl .muted.small{color:var(--dim);margin-top:3px}
.wrap{overflow-x:auto}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar .in{width:auto;min-width:150px}
.bar label.small{display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.14em;font-size:10px}
/* phân đoạn */
.seg{display:flex;gap:24px;border-bottom:1px solid var(--line)}
.seg button{min-height:38px;padding:0;border:0;border-bottom:1px solid transparent;margin-bottom:-1px;background:transparent;color:var(--muted);font-size:12px;letter-spacing:.08em;white-space:nowrap}
.seg button.on{color:var(--text);border-bottom-color:var(--text)}
/* phân quyền */
.split{display:grid;grid-template-columns:260px minmax(0,1fr);gap:48px;align-items:start}
.rolelist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.rolelist button{text-align:left;padding:18px 0 18px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--muted);font-size:14px;position:relative}
.rolelist button .small{color:var(--dim);margin-top:4px}
.rolelist button.on{color:var(--text)}.rolelist button.on::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:2px;background:var(--text)}
.matrix{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 40px}
.matrix fieldset{border:0;border-top:1px solid var(--line);padding:16px 0 0;margin:0}
.matrix legend{padding:0 12px 0 0;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.chk{display:flex;align-items:center;gap:12px;padding:9px 0;font-size:13px;cursor:pointer;color:#DADAD6}
.chk input{appearance:none;width:16px;height:16px;border:1px solid var(--line2);border-radius:2px;margin:0;display:grid;place-content:center;flex-shrink:0;cursor:pointer}
.chk input:checked{background:var(--text);border-color:var(--text)}
.chk input:checked::after{content:"";width:8px;height:4px;border-left:1.5px solid #000;border-bottom:1.5px solid #000;transform:rotate(-45deg) translate(1px,-1px)}
/* hộp thoại */
dialog{background:#0B0B0B;color:var(--text);border:1px solid var(--line2);border-radius:var(--r);padding:36px;width:min(560px,94vw);box-shadow:0 30px 80px rgba(0,0,0,.8)}
dialog::backdrop{background:rgba(0,0,0,.78);backdrop-filter:blur(3px)}
dialog form{display:flex;flex-direction:column;gap:22px}
dialog h2{font-weight:200;font-size:26px;letter-spacing:0}
dialog .bar{padding-top:8px;border-top:1px solid var(--line);margin-top:4px;padding-top:22px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--text);color:#000;padding:14px 22px;border-radius:var(--r);font-size:13px;letter-spacing:.02em;z-index:99;max-width:92vw;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.toast.err{background:var(--rose);color:#2A0F08}
.empty{padding:40px 0;text-align:left;color:var(--dim);font-size:13px}
.diff{font-size:12px;color:var(--dim);max-width:460px;line-height:1.6}
/* trang đặt lịch (nền trắng) */
.bk{max-width:460px;margin:0 auto;min-height:100vh;background:#FFF;color:#0A0A0A;display:flex;flex-direction:column}
.bk header{background:#000;color:#fff;padding:36px 28px 28px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.bk header img{height:92px;width:auto}
.bk header small{font-size:11px!important;letter-spacing:.08em;color:#A9A9A5!important}
.bk .body{flex:1;padding:32px 28px;display:flex;flex-direction:column;gap:14px}
.bk h2{font-weight:200;font-size:30px;line-height:1.15;letter-spacing:-.01em;color:#000}
.bk p{margin:0 0 8px;font-size:13px;color:#6A6A66;line-height:1.65}
.bk .svc{min-height:66px;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:0 4px;border:0;border-bottom:1px solid #ECECE8;border-radius:0;background:transparent;color:#0A0A0A;text-align:left;font-size:14px;transition:padding .15s}
.bk .svc small{display:block;color:#8A8A86;font-size:12px;margin-top:3px}
.bk .svc em{font-style:normal;font-weight:300;font-size:16px;letter-spacing:-.01em}
.bk .svc.on{background:#000!important;color:#fff!important;padding:0 16px;border-color:#000!important}.bk .svc.on small{color:#A9A9A5}
.bk .g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.bk .day,.bk .slot{min-height:48px;border-radius:var(--r);border:1px solid #E4E4E0;background:#fff;color:#0A0A0A;font-size:13px}
.bk .day{min-height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.bk .day small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:inherit;opacity:.7}
.bk .day b{font-weight:300;font-size:22px}
.bk .on{background:#000!important;color:#fff!important;border-color:#000!important}
.bk .in{color:#0A0A0A;border-bottom-color:#D6D6D2}.bk .in:focus{border-bottom-color:#000}
.bk label.f{color:#6A6A66}
.bk footer{padding:18px 28px 30px;border-top:1px solid #ECECE8;display:flex;gap:10px}
.bk footer .go{flex:1;min-height:54px;border-radius:var(--r);border:0;background:#000;color:#fff;font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase}
.bk footer .go:disabled{background:#E6E6E2;color:#8A8A86}
.bk .back{min-height:54px;padding:0 22px;border-radius:var(--r);border:1px solid #D6D6D2;background:#fff;color:#000;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.bk .err{color:#A3372A;font-size:13px}
@media (max-width:980px){.login{grid-template-columns:1fr}.login .art{display:none}.shell{flex-direction:column}
.side{width:auto;height:auto;position:static;border-right:0;border-bottom:1px solid var(--line);padding:22px 0 0;gap:18px}.word{padding:0 20px}
.nav{flex-direction:row;overflow-x:auto;padding:0 8px}.nav a{white-space:nowrap;padding:0 12px}.nav a.on::before{left:12px;right:12px;top:auto;bottom:0;width:auto;height:2px}.who{display:none}
.main{padding:28px 20px 60px;gap:28px}h1{font-size:32px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi{padding:20px 16px;min-width:0}.kpi b{font-size:26px;overflow-wrap:anywhere}.kpi:nth-child(3){border-left:0;padding-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--line)}
.split{grid-template-columns:1fr;gap:28px}.grid2,.matrix{grid-template-columns:1fr}.acts{justify-content:flex-start}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const TZ='Asia/Ho_Chi_Minh';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const vnd=n=>Math.round(+n||0).toLocaleString('vi-VN')+'đ';
const todayStr=()=>new Date().toLocaleDateString('en-CA',{timeZone:TZ});
const monthStr=()=>todayStr().slice(0,7);
const nextMonth=m=>{let [y,mo]=m.split('-').map(Number);mo++;if(mo>12){mo=1;y++}return y+'-'+String(mo).padStart(2,'0')};
const hhmm=iso=>new Date(iso).toLocaleTimeString('vi-VN',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hour12:false});
const dmy=iso=>new Date(iso).toLocaleDateString('vi-VN',{timeZone:TZ});
const dtfull=iso=>new Date(iso).toLocaleString('vi-VN',{timeZone:TZ,hour12:false});
const dtshort=iso=>hhmm(iso)+' '+new Date(iso).toLocaleDateString('vi-VN',{timeZone:TZ,day:'2-digit',month:'2-digit'});
const localISO=(d,t)=>`${d}T${t}:00+07:00`;
const addDays=(d,n)=>{const x=new Date(d+'T00:00:00+07:00');x.setDate(x.getDate()+n);return x.toLocaleDateString('en-CA',{timeZone:TZ})};
const durTxt=m=>m>=60?Math.floor(m/60)+' giờ'+(m%60?' '+m%60+' phút':''):m+' phút';

function toast(m,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.setAttribute('role',err?'alert':'status');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),err?5200:2600)}
const errMsg=e=>(e&&(e.message||e.error_description))||'Có lỗi xảy ra';
async function run(p,okMsg){const {data,error}=await p;if(error){toast(errMsg(error),true);throw error}if(okMsg)toast(okMsg);return data}
function modal(html,onSubmit){const d=document.createElement('dialog');d.innerHTML=`<form method="dialog">${html}<div class="bar" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Đóng</button><button class="btn pri" value="ok">Lưu</button></div></form>`;
document.body.appendChild(d);d.showModal();const f=d.querySelector('form');
f.addEventListener('submit',async ev=>{if(ev.submitter&&ev.submitter.value==='cancel'){return}ev.preventDefault();try{await onSubmit(Object.fromEntries(new FormData(f)),f);d.close()}catch(e){}});
d.addEventListener('close',()=>d.remove());return d}

function viewLogin(msg){const t=S.loginTab;
root.innerHTML=`<div class="login"><section class="art"><img src="${LOGO_W}" alt="Wind Hair House"><p>Hệ thống vận hành</p><span class="small muted">Chỉ dành cho chủ tiệm và nhân sự được cấp quyền. Quý khách đặt lịch tại <a href="#datlich" style="color:var(--text)">trang đặt lịch</a>.</span></section>

<div class="tabs" role="tablist"><button type="button" data-lt="in" class="${t==='in'?'on':''}">Đăng nhập</button><button type="button" data-lt="up" class="${t==='up'?'on':''}">Kích hoạt</button><button type="button" data-lt="fg" class="${t==='fg'?'on':''}">Quên mật khẩu</button></div>

<label class="f">Email<input class="in" name="email" type="email" required autocomplete="email"></label>
${t!=='fg'?`<label class="f">Mật khẩu<input class="in" name="pw" type="password" required minlength="8" autocomplete="${t==='in'?'current-password':'new-password'}"></label>`:''}
<button class="btn pri" style="min-height:48px">${t==='in'?'Đăng nhập':t==='up'?'Tạo mật khẩu và kích hoạt':'Gửi link đặt lại mật khẩu'}</button></form></div></section></div>`;
root.querySelectorAll('[data-lt]').forEach(b=>b.onclick=()=>{S.loginTab=b.dataset.lt;viewLogin()});
root.querySelector('#lf').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const btn=e.target.querySelector('button');btn.disabled=true;
try{if(t==='in'){const {error}=await db.auth.signInWithPassword({email:f.email,password:f.pw});if(error)throw error}
else if(t==='up'){const {data,error}=await db.auth.signUp({email:f.email,password:f.pw,options:{data:{full_name:f.name},emailRedirectTo:location.origin+location.pathname}});if(error)throw error;
 if(!data.session){S.loginTab='in';return viewLogin({t:'Đã tạo tài khoản. Mở email để xác nhận rồi quay lại đăng nhập.'})}}
else{const {error}=await db.auth.resetPasswordForEmail(f.email,{redirectTo:location.origin+location.pathname+'#doimatkhau'});if(error)throw error;return viewLogin({t:'Đã gửi link đặt lại mật khẩu vào email.'})}}

async function pTongquan(){const d=todayStr(),m=monthStr();
const [ap,cash,pend]=await Promise.all([
 db.from('appointments').select('status,price,start_at').gte('start_at',localISO(d,'00:00')).lt('start_at',localISO(addDays(d,1),'00:00')),
 db.from('cash_entries').select('kind,amount,voided,entry_date').gte('entry_date',m+'-01').lt('entry_date',nextMonth(m)+'-01'),
 db.from('appointments').select('id,code,start_at,hard_reason,customers(name,phone),services(name)').eq('status','cho_duyet').order('start_at')]);
const A=(ap.data||[]).filter(x=>!['huy','khong_den'].includes(x.status));const C=(cash.data||[]).filter(x=>!x.voided);
const thu=C.filter(x=>x.kind==='thu').reduce((s,x)=>s+ +x.amount,0),chi=C.filter(x=>x.kind==='chi').reduce((s,x)=>s+ +x.amount,0);
pg().innerHTML=`<div class="head"><div><div class="small muted">${new Date().toLocaleDateString('vi-VN',{timeZone:TZ,weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div><h1>Xin chào, ${esc(S.me.full_name)}</h1></div>
<div class="bar"><a class="btn" href="#datlich" target="_blank" rel="noopener">Trang đặt lịch của khách</a>${can('lich_hen.tao')?'<button class="btn pri" id="new">Tạo lịch hẹn</button>':''}</div></div>
<div class="kpis"><div class="kpi"><span>Lịch hẹn hôm nay</span><b>${A.length}</b><span>${A.filter(x=>x.status==='hoan_thanh').length} đã hoàn thành</span></div>
<div class="kpi"><span>Doanh thu dự kiến hôm nay</span><b>${vnd(A.reduce((s,x)=>s+ +x.price,0))}</b><span>Đã thu ${vnd(A.filter(x=>x.status==='hoan_thanh').reduce((s,x)=>s+ +x.price,0))}</span></div>
<div class="kpi"><span>Thu tháng này</span><b>${vnd(thu)}</b><span>Chi ${vnd(chi)}</span></div>
<div class="kpi"><span>Lãi tạm tính tháng</span><b>${vnd(thu-chi)}</b><span>Mỗi thành viên 1/3: ${vnd((thu-chi)/3)}</span></div></div>
<div id="alerts"></div><section class="panel"><h2 style="margin-bottom:12px">Ca khó chờ duyệt</h2>${(pend.data||[]).length?`<div class="wrap"><table class="tbl"><tbody>${pend.data.map(x=>`<tr><td class="t">${hhmm(x.start_at)} <span class="small muted">${dmy(x.start_at)}</span></td><td>${esc(x.customers?.name)}<div class="small muted">${esc(x.customers?.phone)}</div></td><td>${esc(x.services?.name)}<div class="small muted">${esc(x.hard_reason||'')}</div></td><td><div class="acts">${can('lich_hen.duyet_ca_kho')?`<button class="btn sm pri" data-ok="${x.id}">Duyệt</button>`:''}</div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Không có ca khó nào đang chờ.</div>'}</section>`;
pg().querySelectorAll('[data-ok]').forEach(b=>b.onclick=async()=>{await run(db.from('appointments').update({status:'da_chot'}).eq('id',b.dataset.ok),'Đã duyệt');pTongquan()});
const nb=pg().querySelector('#new');if(nb)nb.onclick=()=>apptForm(()=>pTongquan());
const [lw,tk]=await Promise.all([can('kho.xem')?db.from('products').select('name,stock,min_stock,unit').eq('active',true).gt('min_stock',0):Promise.resolve({data:[]}),can('cong_viec.xem_tat_ca')?db.from('tasks').select('title,due_at').in('status',['chua_lam','dang_lam']).lt('due_at',new Date().toISOString()):Promise.resolve({data:[]})]);
const low=(lw.data||[]).filter(p=>+p.stock<=+p.min_stock);const al=[];
if(low.length)al.push(`<a href="#kho" class="msg err" style="display:block;text-decoration:none">Sắp hết hàng: ${low.map(p=>esc(p.name)+' (còn '+ +p.stock+' '+esc(p.unit)+')').join(', ')}</a>`);
if((tk.data||[]).length)al.push(`<a href="#congviec" class="msg err" style="display:block;text-decoration:none">Việc quá hạn: ${tk.data.map(t=>esc(t.title)).join(', ')}</a>`);
const box=document.getElementById('alerts');if(box)box.innerHTML=al.join('<div style="height:10px"></div>')}

let apDate=todayStr();
async function staffList(){const {data}=await db.from('members').select('user_id,full_name,staff_kind,active').not('staff_kind','is',null).eq('active',true).order('full_name');return data||[]}
async function pLichhen(){
const {data,error}=await db.from('appointments').select('*,customers(name,phone),services(name,duration_min),stylist:members!appointments_stylist_id_fkey(full_name),assistant:members!appointments_assistant_id_fkey(full_name)')
 .gte('start_at',localISO(apDate,'00:00')).lt('start_at',localISO(addDays(apDate,1),'00:00')).order('start_at');if(error)throw error;
const mine=!can('lich_hen.xem_tat_ca');
pg().innerHTML=`<div class="head"><div><div class="small muted">${mine?'Lịch của tôi':'Lịch cả tiệm'}</div><h1>Lịch hẹn</h1></div>
<div class="bar"><button class="btn sm" id="prev" aria-label="Ngày trước">‹</button><input class="in" type="date" id="dt" value="${apDate}" aria-label="Chọn ngày"><button class="btn sm" id="next" aria-label="Ngày sau">›</button><button class="btn sm" id="today">Hôm nay</button>${can('lich_hen.tao')?'<button class="btn pri" id="new">Tạo lịch hẹn</button>':''}</div></div>
<section class="panel wrap">${data.length?`<table class="tbl"><thead><tr><th>Giờ</th><th>Khách</th><th>Dịch vụ</th><th>Thợ</th><th>Tiền</th><th>Trạng thái</th><th></th></tr></thead><tbody>${data.map(x=>{
const acts=[];const mineRow=x.stylist_id===S.me.user_id||x.assistant_id===S.me.user_id;const canEdit=can('lich_hen.sua')||(can('lich_hen.cap_nhat_cua_minh')&&mineRow);
if(x.status==='cho_duyet'&&can('lich_hen.duyet_ca_kho'))acts.push(`<button class="btn sm pri" data-a="duyet" data-id="${x.id}">Duyệt</button>`);
if(x.status==='da_chot'&&canEdit)acts.push(`<button class="btn sm" data-a="den" data-id="${x.id}">Khách đến</button>`);
if(['da_chot','da_den'].includes(x.status)&&canEdit)acts.push(`<button class="btn sm pri" data-a="xong" data-id="${x.id}">Hoàn thành</button>`);
if(['da_chot','cho_duyet'].includes(x.status)&&can('lich_hen.sua'))acts.push(`<button class="btn sm" data-a="vang" data-id="${x.id}">Không đến</button>`);
if(!['huy','hoan_thanh','khong_den'].includes(x.status)&&can('lich_hen.huy'))acts.push(`<button class="btn sm danger" data-a="huy" data-id="${x.id}">Huỷ</button>`);
return `<tr><td class="t">${hhmm(x.start_at)}<div class="small muted">đến ${hhmm(x.end_at)}</div></td><td>${esc(x.customers?.name)}<div class="small muted">${esc(x.customers?.phone)}${x.customer_kind==='ca_nhan'?', khách ruột':''}</div></td>
<td>${esc(x.services?.name)}<div class="small muted">#${x.code}, ${esc(x.channel||'')}</div></td><td>${esc(x.stylist?.full_name||'Chưa phân')}${x.assistant?`<div class="small muted">Phụ: ${esc(x.assistant.full_name)}</div>`:''}</td>
<td>${vnd(x.price)}${+x.tip?`<div class="small muted">Tip ${vnd(x.tip)}</div>`:''}</td><td><span class="pill p-${x.status}">${ST[x.status]}</span>${x.cancel_reason?`<div class="small muted">${esc(x.cancel_reason)}</div>`:''}</td><td><div class="acts">${acts.join('')}</div></td></tr>`}).join('')}</tbody></table>`:'<div class="empty">Không có lịch hẹn trong ngày này.</div>'}</section>`;
const go=d=>{apDate=d;pLichhen()};pg().querySelector('#dt').onchange=e=>go(e.target.value);pg().querySelector('#prev').onclick=()=>go(addDays(apDate,-1));pg().querySelector('#next').onclick=()=>go(addDays(apDate,1));pg().querySelector('#today').onclick=()=>go(todayStr());
const nb=pg().querySelector('#new');if(nb)nb.onclick=()=>apptForm(pLichhen);
pg().querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{const id=b.dataset.id,a=b.dataset.a;
if(a==='duyet')await run(db.from('appointments').update({status:'da_chot'}).eq('id',id),'Đã duyệt');
if(a==='den')await run(db.from('appointments').update({status:'da_den'}).eq('id',id),'Đã check-in');
if(a==='vang')await run(db.from('appointments').update({status:'khong_den'}).eq('id',id),'Đã ghi khách không đến');
if(a==='huy'){return modal(`<h2>Huỷ lịch hẹn</h2><label class="f">Lý do huỷ (bắt buộc)<textarea class="in" name="r" required></textarea></label>`,async f=>{await run(db.from('appointments').update({status:'huy',cancel_reason:f.r}).eq('id',id),'Đã huỷ lịch');pLichhen()})}
if(a==='xong'){const st=(await staffList()).filter(s=>s.staff_kind==='tho_phu');
return modal(`<h2>Hoàn thành dịch vụ</h2><p class="small muted" style="margin:0">Hệ thống sẽ tự ghi phiếu thu, tính hoa hồng và cập nhật hồ sơ khách.</p>
<label class="f">Thợ phụ hỗ trợ<select class="in" name="as"><option value="">Không có</option>${st.map(s=>`<option value="${s.user_id}">${esc(s.full_name)}</option>`).join('')}</select></label>
<div class="grid2"><label class="f">Tiền tip<input class="in" name="tip" type="number" min="0" step="1000" value="0"></label><label class="f">Số tép nối<input class="in" name="hp" type="number" min="0" value="0"></label></div>`,
async f=>{await run(db.from('appointments').update({status:'hoan_thanh',assistant_id:f.as||null,tip:+f.tip||0,hair_pieces:+f.hp||0}).eq('id',id),'Đã hoàn thành và ghi thu');pLichhen()})}
pLichhen()})}
async function apptForm(done){const [{data:sv},st]=await Promise.all([db.from('services').select('id,name,price,duration_min').eq('active',true).gt('duration_min',0).order('sort'),staffList()]);
const d=modal(`<h2>Tạo lịch hẹn</h2><div class="grid2"><label class="f">Số điện thoại khách<input class="in" name="phone" inputmode="tel" required pattern="0[0-9]{9}" title="10 số, bắt đầu bằng 0"></label><label class="f">Tên khách<input class="in" name="name" required></label></div>
<label class="f">Dịch vụ<select class="in" name="sv" required>${(sv||[]).map(s=>`<option value="${s.id}">${esc(s.name)} — ${vnd(s.price)}, ${durTxt(s.duration_min)}</option>`).join('')}</select></label>
<div class="grid2"><label class="f">Ngày<input class="in" type="date" name="d" value="${apDate}" required></label><label class="f">Giờ bắt đầu<input class="in" type="time" name="t" step="1800" value="09:00" required></label></div>
<label class="f">Thợ chính<select class="in" name="st"><option value="">Để hệ thống tự phân sau</option>${st.filter(s=>s.staff_kind==='tho_chinh').map(s=>`<option value="${s.user_id}">${esc(s.full_name)}</option>`).join('')}</select></label>
<div class="grid2"><label class="f">Kênh<select class="in" name="ch">${['Gọi điện','Fanpage','Zalo','TikTok','Vãng lai','Giới thiệu'].map(c=>`<option>${c}</option>`).join('')}</select></label><label class="f">Ghi chú<input class="in" name="note"></label></div>`,
async f=>{const phone=f.phone.replace(/\D/g,'');let {data:c}=await db.from('customers').select('id').eq('phone',phone).maybeSingle();
if(!c)c=await run(db.from('customers').insert({business_id:BUSINESS_ID,name:f.name,phone,channel:f.ch}).select('id').single());
await run(db.from('appointments').insert({business_id:BUSINESS_ID,customer_id:c.id,service_id:f.sv,stylist_id:f.st||null,start_at:localISO(f.d,f.t),channel:f.ch,note:f.note||null,created_by:S.me.user_id}),'Đã tạo lịch hẹn');done()});
const ph=d.querySelector('[name=phone]');ph.addEventListener('change',async()=>{const p=ph.value.replace(/\D/g,'');if(p.length!==10)return;const {data}=await db.from('customers').select('name,tier').eq('phone',p).maybeSingle();if(data){d.querySelector('[name=name]').value=data.name;toast('Khách quen: '+data.name)}})}

<section class="panel wrap">${data.length?`<table class="tbl"><thead><tr><th>Khách</th><th>Hạng</th><th>Lượt</th><th>Tổng chi</th><th>Lần gần nhất</th><th>Thợ quen</th><th></th></tr></thead><tbody>${data.map(c=>`<tr><td>${esc(c.name)}<div class="small muted">${esc(c.phone)}${c.hair_note?', '+esc(c.hair_note):''}</div></td><td><span class="pill ${c.tier==='vip'?'p-doing':c.tier==='quen'?'p-ok':'p-off'}">${{moi:'Mới',quen:'Quen',vip:'VIP'}[c.tier]}</span></td><td>${c.visits}</td><td>${vnd(c.total_spent)}</td><td>${c.last_visit_at?dmy(c.last_visit_at):'—'}</td><td>${esc(c.loyal?.full_name||'—')}</td><td>${can('khach_hang.sua')?`<button class="btn sm" data-e="${c.id}">Sửa</button>`:''}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Chưa có khách nào.</div>'}</section>`;
const qi=pg().querySelector('#q');qi.onchange=()=>pKhach(qi.value.trim());

modal(`<h2>${c.id?'Sửa hồ sơ khách':'Thêm khách'}</h2><div class="grid2"><label class="f">Tên<input class="in" name="name" required value="${esc(c.name)}"></label><label class="f">Số điện thoại<input class="in" name="phone" required pattern="0[0-9]{9}" value="${esc(c.phone)}"></label></div>

<label class="f">Khách ruột của thợ<select class="in" name="loyal_to"><option value="">Không</option>${st.map(s=>`<option value="${s.user_id}" ${c.loyal_to===s.user_id?'selected':''}>${esc(s.full_name)}</option>`).join('')}</select></label>
<label class="f">Tình trạng tóc<textarea class="in" name="hair_note">${esc(c.hair_note)}</textarea></label>`,

let cashMonth=monthStr();
async function pThuchi(){let rows=[];if(can('thu_chi.xem')){const {data,error}=await db.from('cash_entries').select('*').gte('entry_date',cashMonth+'-01').lt('entry_date',nextMonth(cashMonth)+'-01').order('entry_date',{ascending:false}).order('created_at',{ascending:false});if(error)throw error;rows=data.filter(x=>x.entry_date.startsWith(cashMonth))}
const ok=rows.filter(x=>!x.voided),thu=ok.filter(x=>x.kind==='thu').reduce((s,x)=>s+ +x.amount,0),chi=ok.filter(x=>x.kind==='chi').reduce((s,x)=>s+ +x.amount,0);
pg().innerHTML=`<div class="head"><h1>Thu chi</h1><div class="bar"><input class="in" type="month" id="m" value="${cashMonth}" aria-label="Chọn tháng">${can('thu_chi.tao')?'<button class="btn pri" id="add">Lập phiếu</button>':''}</div></div>
${can('thu_chi.xem')?`<div class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="kpi"><span>Tổng thu</span><b>${vnd(thu)}</b></div><div class="kpi"><span>Tổng chi</span><b>${vnd(chi)}</b></div><div class="kpi"><span>Chênh lệch</span><b>${vnd(thu-chi)}</b><span>Mỗi thành viên 1/3: ${vnd((thu-chi)/3)}</span></div></div>

${r?`<section class="panel" style="display:flex;flex-direction:column;gap:18px"><div class="head"><div><h2>${esc(r.name)}</h2><div class="small muted" style="margin-top:4px">${esc(r.description||'')}</div></div><div class="acts"><button class="btn sm" id="er">Sửa tên, giờ đăng nhập</button><button class="btn sm" id="cp">Sao chép</button>${used?'':'<button class="btn sm danger" id="dr">Xoá vai trò</button>'}</div></div>

pg().querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{roleSel=b.dataset.r;pVaitro()});

const rf=(x,copy)=>modal(`<h2>${x&&!copy?'Sửa vai trò':copy?'Sao chép vai trò':'Thêm vai trò'}</h2><label class="f">Tên vai trò<input class="in" name="name" required value="${esc(copy?x.name+' (bản sao)':x?.name)}"></label><label class="f">Mô tả<input class="in" name="d" value="${esc(x?.description)}"></label>

async f=>{const row={name:f.name,description:f.d||null,login_from:f.a||null,login_to:f.b||null};
if(x&&!copy){await run(db.from('roles').update(row).eq('id',x.id),'Đã lưu')}else{const n=await run(db.from('roles').insert({...row,business_id:BUSINESS_ID}).select('id').single(),'Đã tạo vai trò');

pg().querySelector('#nr').onclick=()=>rf();const q=id=>pg().querySelector(id);if(q('#er'))q('#er').onclick=()=>rf(r);if(q('#cp'))q('#cp').onclick=()=>rf(r,true);

${low.length?`<div class="msg err">Sắp hết: ${low.map(p=>`${esc(p.name)} (còn ${+p.stock} ${esc(p.unit)})`).join(', ')}</div>`:''}
<section class="panel wrap">${ps.length?`<table class="tbl"><thead><tr><th>Sản phẩm</th><th>Tồn</th><th>Mức cảnh báo</th><th>Giá nhập</th><th>Giá bán lẻ</th><th></th></tr></thead><tbody>${ps.map(p=>`<tr style="${p.active?'':'opacity:.5'}"><td>${esc(p.name)}</td><td class="t" style="${+p.min_stock>0&&+p.stock<=+p.min_stock?'color:var(--rose)':''}">${+p.stock} <span class="small muted">${esc(p.unit)}</span></td><td>${+p.min_stock||'—'}</td><td>${+p.cost?vnd(p.cost):'—'}</td><td>${p.sell_price?vnd(p.sell_price):'—'}</td>
<td><div class="acts">${ql?`<button class="btn sm pri" data-m="nhap" data-id="${p.id}">Nhập</button>`:''}${xd?`<button class="btn sm" data-m="xuat_dung" data-id="${p.id}">Xuất dùng</button>`:''}${xd&&p.sell_price?`<button class="btn sm" data-m="ban" data-id="${p.id}">Bán</button>`:''}${ql?`<button class="btn sm" data-m="kiem_ke" data-id="${p.id}">Kiểm kê</button><button class="btn sm" data-e="${p.id}">Sửa</button>`:''}</div></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Chưa có sản phẩm. Bấm Thêm sản phẩm, sau đó dùng Nhập để khai báo tồn đầu.</div>'}</section>

const pf=p=>{p=p||{unit:'chai',active:true};modal(`<h2>${p.id?'Sửa sản phẩm':'Thêm sản phẩm'}</h2><div class="grid2"><label class="f">Tên<input class="in" name="n" required value="${esc(p.name)}"></label><label class="f">Đơn vị<input class="in" name="u" required value="${esc(p.unit)}"></label></div>
<div class="grid2"><label class="f">Cảnh báo khi còn ≤<input class="in" type="number" name="mi" min="0" step="0.5" value="${p.min_stock??0}"></label><label class="f">Giá bán lẻ (để trống nếu không bán)<input class="in" type="number" name="sp" min="0" step="1000" value="${p.sell_price??''}"></label></div>
<label class="chk"><input type="checkbox" name="a" ${p.active?'checked':''}> Đang dùng</label>`,async v=>{const row={name:v.n,unit:v.u,min_stock:+v.mi||0,sell_price:v.sp?+v.sp:null,active:!!v.a};
if(p.id)await run(db.from('products').update(row).eq('id',p.id),'Đã lưu');else await run(db.from('products').insert({...row,business_id:BUSINESS_ID}),'Đã thêm');pKho()})};

<div class="kpi"><span>Thu − chi (sổ quỹ)</span><b>${vnd(r.thu-r.chi)}</b><span>Thu ${vnd(r.thu)}, chi ${vnd(r.chi)}</span></div>

<div class="grid2" style="gap:20px"><section class="panel"><h2 style="margin-bottom:10px">Theo thợ</h2>${bars(r.by_stylist,'revenue','name',vnd)}</section>

<label class="f">Số điện thoại<input class="in" id="bp" type="tel" inputmode="tel" value="${esc(B.phone)}" autocomplete="tel" placeholder="09xx xxx xxx"></label>
${B.err?`<span class="err" role="alert">${esc(B.err)}</span>`:''}<p>${esc(svc.name)}, ${B.day.split('-').reverse().join('/')} lúc ${B.time}. <b>${vnd(svc.price)}</b></p>`;
if(B.step===3)body=`<div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px"><h2>Tiệm đã giữ chỗ cho ${esc(B.name)} ạ</h2><p>${esc(B.done.service)} lúc ${esc(B.done.start)}.<br>${B.done.status==='cho_duyet'?'Dạ dịch vụ này cần thợ xem tóc trước, tiệm sẽ gọi điện xác nhận với quý khách trong ngày ạ.':'Tiệm sẽ nhắn tin nhắc lịch trước 1 ngày ạ. Hẹn gặp quý khách!'}</p><p>Mã lịch của quý khách: #${B.done.code}</p></div>`;
const lbl=B.step===1&&!B.time?'Vui lòng chọn khung giờ ạ':['Tiếp tục','Tiếp tục','Xác nhận đặt lịch','Đặt thêm lịch'][B.step];
root.innerHTML=`<div class="bk"><header><img src="${LOGO_W}" alt="Wind Hair House"><small style="color:#BDBDB8">${esc(B.cat.business.address||'')}. Tiệm nhận khách từ ${B.cat.business.open} ạ.</small></header><div class="body">${body}</div>
<footer>${B.step===1||B.step===2?'<button type="button" class="back" id="bb">Quay lại</button>':''}<button type="button" class="go" id="bg" ${B.step===1&&!B.time?'disabled':''}>${lbl}</button></footer></div>`;
root.querySelectorAll('[data-sv]').forEach(b=>b.onclick=()=>{B.sv=b.dataset.sv;B.time='';B.slots=null;B.loaded=false;bookPage()});
root.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{B.day=b.dataset.day;B.time='';B.slots=null;B.loaded=false;bookPage()});
root.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{B.time=b.dataset.t;bookPage()});
const bn=root.querySelector('#bn'),bp=root.querySelector('#bp');if(bn){bn.oninput=()=>B.name=bn.value;bp.oninput=()=>B.phone=bp.value}
const bb=root.querySelector('#bb');if(bb)bb.onclick=()=>{B.step--;B.err='';bookPage()};
root.querySelector('#bg').onclick=async e=>{if(B.step===0){B.step=1;B.slots=null;B.loaded=false}else if(B.step===1)B.step=2;
else if(B.step===2){e.target.disabled=true;const {data,error}=await db.rpc('book_online',{p_business:BUSINESS_ID,p_service:B.sv,p_date:B.day,p_time:B.time,p_name:B.name,p_phone:B.phone});
if(error){B.err=error.message;if(/kín|giờ khác|muộn hơn/.test(error.message)){B.step=1;B.slots=null;B.loaded=false;B.time=''}}else{B.done=data;B.step=3;B.err=''}}
else Object.assign(B,{step:0,time:'',slots:null,loaded:false,done:null});bookPage()}}

/* =================== KHỞI ĐỘNG =================== */
async function boot(){const h=location.hash.slice(1);
if(!db){root.innerHTML=`<div class="login"><section class="form"><div class="box"><h1>${window.supabase?'Chưa cấu hình':'Không tải được thư viện'}</h1><div class="msg">${window.supabase?'Mở file index.html, dán SUPABASE_URL, SUPABASE_ANON_KEY và BUSINESS_ID ở đầu phần script.':'Kiểm tra kết nối mạng rồi tải lại trang.'}</div></div></section></div>`;return}
if(h==='datlich')return bookPage();
if(h==='doimatkhau')return viewNewPassword();
const {data:{session}}=await db.auth.getSession();S.session=session;
if(!session)return viewLogin();
await loadMe();
if(!S.me)return viewBlocked('Chưa được cấp quyền','Tài khoản này chưa có lời mời từ chủ tiệm. Nhờ chủ tiệm vào Tài khoản nhân sự, cấp tài khoản cho đúng email của bạn, rồi đăng ký lại.');
if(!S.me.active)return viewBlocked('Tài khoản đã bị khoá','Liên hệ chủ tiệm để mở lại.');
if(!S.me.is_owner&&!S.perms.size&&S.me.roles?.login_from)return viewBlocked('Ngoài giờ làm việc',`Vai trò của bạn chỉ thao tác được từ ${S.me.roles.login_from.slice(0,5)} đến ${S.me.roles.login_to.slice(0,5)}.`);
if(PAGES[h])S.page=h;shell()}
if(db)db.auth.onAuthStateChange((ev,session)=>{if(ev==='PASSWORD_RECOVERY'){location.hash='doimatkhau';return}if(ev==='SIGNED_IN'||ev==='SIGNED_OUT'){const was=!!S.session;S.session=session;if(was!==!!session)boot()}});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h==='datlich'||h==='doimatkhau'||!S.me)return boot();if(PAGES[h]){S.page=h;shell()}});
boot();
</script>
</body>
</html>
